<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo Ptolemaico 3D - Cielo Planetario</title>
  <link rel="stylesheet" href="components/MenuBar/MenuBar.css">
  <link rel="stylesheet" href="components/TimeHud/TimeHud.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Three.js -->
  <script type="importmap">
        {
            "imports": {
                "three": "./assets/js/three.module.js",
                "OrbitControls": "./assets/js/OrbitControls.js"
            }
        }
    </script>
  <!-- SheetJS for reading the xlsx file -->
  <script src="./assets/js/xlsx.full.min.js"></script>
  <!-- Global Configuration Script -->
  <script src="js/config.js"></script>
</head>

<body>

  <!-- Barra de Menú Superior -->
  <header class="top-menubar">
    <div class="menubar-branding">
      <svg class="app-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9" />
        <ellipse cx="12" cy="12" rx="9" ry="3.5" stroke-width="1.2" />
        <circle cx="12" cy="12" r="2.5" fill="currentColor" />
      </svg>
      <span class="app-title">Modelo Ptolemaico 3D</span>
    </div>

    <nav class="menubar-nav">
      <!-- Menú Capas Astronómicas -->
      <div class="menu-item">
        <button class="menu-btn">
          <span>Ver</span>
          <svg class="chevron" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="dropdown-menu">
          <div class="dropdown-header">Elementos Visibles</div>
          <label class="dropdown-checkbox">
            <input type="checkbox" id="toggle-stars" checked>
            <span>Estrellas</span>
          </label>
          <label class="dropdown-checkbox">
            <input type="checkbox" id="toggle-zodiac" checked>
            <span>Zodiaco</span>
          </label>
          <label class="dropdown-checkbox">
            <input type="checkbox" id="toggle-orbits" checked>
            <span>Órbitas</span>
          </label>
          <label class="dropdown-checkbox">
            <input type="checkbox" id="toggle-grid">
            <span>Cuadrícula Ecuatorial</span>
          </label>
        </div>
      </div>

      <!-- Menú Seleccionar Astro -->
      <div class="menu-item">
        <button class="menu-btn">
          <span>Astro</span>
          <svg class="chevron" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="dropdown-menu">
          <div class="dropdown-header">Seleccionar Astro</div>
          <label class="dropdown-radio">
            <input type="radio" name="selected-astro" id="astro-moon" value="moon">
            <span>Luna</span>
          </label>
          <label class="dropdown-radio">
            <input type="radio" name="selected-astro" id="astro-venus" value="venus" checked>
            <span>Venus</span>
          </label>
          <label class="dropdown-radio">
            <input type="radio" name="selected-astro" id="astro-mars" value="mars">
            <span>Marte</span>
          </label>
          <div class="dropdown-divider"></div>
          <label class="dropdown-checkbox">
            <input type="checkbox" id="toggle-apparent-pos">
            <span>Posición Aparente</span>
          </label>
        </div>
      </div>

      <!-- Menú Cámara -->
      <div class="menu-item">
        <button class="menu-btn">
          <span>Cámara</span>
          <svg class="chevron" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="dropdown-menu">
          <div class="dropdown-header">Modos de Cámara</div>
          <label class="dropdown-radio">
            <input type="radio" name="camera-mode" id="cam-center-earth" value="earth" checked>
            <span>Centrar en la Tierra</span>
          </label>
          <label class="dropdown-radio">
            <input type="radio" name="camera-mode" id="cam-follow-astro" value="astro">
            <span>Seguir al Astro</span>
          </label>
        </div>
      </div>
    </nav>

    <!-- Insignia de Día Derecha -->
    <div class="menubar-badge">
      <div class="badge-item">
        <label>Día:</label>
        <span id="menubar-day-val">0</span>
      </div>
    </div>
  </header>

  <!-- Contenedor del Lienzo 3D -->
  <div id="canvas-container"></div>

  <div id="loading-indicator">Cargando estrellas...</div>

  <!-- Entry Point Principal -->
  <script type="module" src="js/main.js"></script>

</body>

</html>
