<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielo Planetario - Three.js</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Three.js (via CDN for now, can be local if needed) -->
  <script type="importmap">
        {
            "imports": {
                "three": "./assets/js/three.module.js",
                "OrbitControls": "./assets/js/OrbitControls.js"
            }
        }
    </script>
  <!-- SheetJS for reading the xlsx file -->
  <script src="./assets/js/xlsx.full.min.js"></script>
</head>

<body>

  <div id="canvas-container"></div>

  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
    <!-- SVGs for Sun/Moon -->
    <svg class="sun-icon" viewBox="0 0 24 24" style="display: none;">
      <path
        d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
    </svg>
    <svg class="moon-icon" viewBox="0 0 24 24">
      <path
        d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
    </svg>
  </button>

  <div id="ui-overlay">
    <div class="control-group">
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-stars" checked>
        <span class="slider"></span>
        <span class="label-text">Estrellas</span>
      </label>
    </div>
    <div class="control-group">
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-zodiac">
        <span class="slider"></span>
        <span class="label-text">Zodiaco</span>
      </label>
    </div>
    <div class="control-group">
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-grid">
        <span class="slider"></span>
        <span class="label-text">Cuadrícula Ecuatorial</span>
      </label>
    </div>
    <div class="control-group">
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-ecliptic">
        <span class="slider"></span>
        <span class="label-text">Eclíptica</span>
      </label>
    </div>


    <div class="control-group">
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-orbits" checked>
        <span class="slider"></span>
        <span class="label-text">Órbitas</span>
      </label>
    </div>
    <div class="control-group">
      <label>Velocidad Tiempo:</label>
      <input type="range" id="speed-range" min="0" max="100" value="1">
      <span id="speed-value">1x</span>
    </div>
    <div class="control-group">
      <label>Día del año:</label>
      <input type="range" id="day-range" min="0" max="365" value="0">
      <span id="day-value">0</span>
    </div>
    <div class="control-group">
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-follow-sun">
        <span class="slider"></span>
        <span class="label-text">Seguir Sol</span>
      </label>
    </div>
    <div class="control-group">
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-autotime" checked>
        <span class="slider"></span>
        <span class="label-text">Animar Tiempo (Auto)</span>
      </label>
    </div>



    <div id="loading-indicator">Cargando estrellas...</div>
  </div>

  <!-- Main Entry Point -->
  <script type="module" src="js/main.js"></script>

</body>

</html>
