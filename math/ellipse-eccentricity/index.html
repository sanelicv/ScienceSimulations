<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excentricidad de una elipse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="canvas-container">
    <canvas id="ellipseCanvas"></canvas>
  </div>

  <div id="ecc-container">
    <label for="eRange" id="eLabel">Excentricidad: e = <span id="eValue">0.00</span></label>
    <div class="controls-row">
      <input type="range" id="eRange" min="0" max="0.95" step="0.01" value="0.00">
      <input type="number" id="eInput" min="0" max="0.95" step="0.01" value="0.00">
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
